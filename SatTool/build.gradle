plugins {
    id 'java'
    id 'org.springframework.boot' version '4.0.0'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'org.graalvm.buildtools.native' version '0.11.3'
}

group = 'org.example'
version = '0.0.1-SNAPSHOT'
description = 'SatTool'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencies {
    testImplementation 'org.springframework.boot:spring-boot-starter-test'

    implementation 'org.springframework.boot:spring-boot-starter'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation "org.springframework.boot:spring-boot-autoconfigure"

    compileOnly 'org.projectlombok:lombok'
    developmentOnly 'org.springframework.boot:spring-boot-devtools'

    annotationProcessor 'org.projectlombok:lombok'

    //궤도 관련
    implementation 'org.orekit:orekit:13.1.5'
    implementation "org.hipparchus:hipparchus-core"
    implementation "org.hipparchus:hipparchus-geometry"
    implementation "org.hipparchus:hipparchus-ode"        // (Orekit 일부 기능에서 필요)
    implementation "org.hipparchus:hipparchus-fitting"    // (상황에 따라)

    //java.time.LocalDateTime 같은 Java 8 날짜/시간 타입을 기본적으로 직렬화/역직렬화하지 못해서 발생하는 문제
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310'
}

tasks.named('test') {
    useJUnitPlatform()
    jvmArgs '-Xmx4g', '-XX:+UseParallelGC'

    testLogging {
        showStandardStreams = true
        events "passed", "failed", "skipped"
    }
}
